<!DOCTYPE html>
<html>
<head>
    <title>StreetSignal</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; background: #f4f7f6; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        input { width: 70%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        ul { list-style: none; padding: 0; }
        li { background: white; margin: 10px 0; padding: 10px; border-left: 5px solid #007bff; border-radius: 3px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🚨 StreetSignal</h1>
        <p>Report a civic issue in your neighborhood.</p>
        <form action="/submit" method="POST">
            <input type="text" name="complaint" placeholder="e.g. Pothole on 5th Ave" required>
            <button type="submit">Send</button>
        </form>
    </div>

    <h3>Live Feed</h3>
    <ul>
        {% for c in complaints %}
            <li>{{ c.text }}</li>
        {% endfor %}
    </ul>
</body>
</html>
